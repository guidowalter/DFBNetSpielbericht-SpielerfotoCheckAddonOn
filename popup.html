<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kadercheck Einstellungen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #f8f9fa;
    }

    header {
      background: #006633;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header img { width: 24px; height: 24px; border-radius: 4px; }
    header h1 { font-size: 15px; font-weight: 600; }
    header p  { font-size: 11px; opacity: 0.8; }

    .section {
      background: #fff;
      margin: 10px;
      border-radius: 8px;
      padding: 14px;
      border: 1px solid #e2e8f0;
    }
    .section h2 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 4px;
    }
    .field { margin-bottom: 10px; }
    .field:last-of-type { margin-bottom: 0; }

    .input-wrap { position: relative; }
    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      color: #111827;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: #006633; box-shadow: 0 0 0 2px rgba(0,102,51,.12); }

    .toggle-vis {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      color: #6b7280;
      padding: 2px;
    }
    .toggle-vis:hover { color: #111; }
    input[type="password"] { padding-right: 32px; }

    .hint {
      font-size: 11px;
      color: #6b7280;
      margin-top: 3px;
      line-height: 1.4;
    }

    .btn-row { display: flex; gap: 8px; margin-top: 12px; }
    button.primary {
      flex: 1;
      background: #006633;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.primary:hover  { background: #005229; }
    button.primary:active { background: #004020; }
    button.primary:disabled { background: #9ca3af; cursor: not-allowed; }

    button.secondary {
      background: #f1f5f9;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.secondary:hover { background: #e2e8f0; }

    #status {
      margin: 0 10px 4px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    #status.ok      { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    #status.error   { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    #status.info    { background: #e0f2fe; color: #075985; border: 1px solid #7dd3fc; }

    footer {
      padding: 8px 10px 10px;
      font-size: 10px;
      color: #9ca3af;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <img src="icon48.png" alt="" />
    <div>
      <h1>Kadercheck</h1>
      <p>Spielerhistorie im Spielbericht</p>
    </div>
  </header>

  <div id="status"></div>

  <div class="section">
    <h2>Verbindung</h2>

    <div class="field">
      <label for="api-url">API-URL</label>
      <input type="text" id="api-url" placeholder="https://kadercheck.dev" autocomplete="off" spellcheck="false" />
    </div>

    <div class="field">
      <label for="token">Trainer-Token</label>
      <div class="input-wrap">
        <input type="password" id="token" placeholder="kc_…" autocomplete="off" spellcheck="false" />
        <button class="toggle-vis" id="toggle-vis" title="Token anzeigen/verstecken">👁</button>
      </div>
      <div class="hint">Erhalten Sie von Ihrem Kreis-Administrator.</div>
    </div>
  </div>

  <div class="section">
    <h2>Saison</h2>
    <div class="field">
      <label for="saison">Aktive Saison</label>
      <select id="saison"></select>
      <div class="hint">Wird automatisch vorgeschlagen – bei Bedarf ändern.</div>
    </div>
  </div>

  <div class="btn-row" style="margin: 0 10px 10px;">
    <button class="secondary" id="btn-test">Verbindung testen</button>
    <button class="primary" id="btn-save">Speichern</button>
  </div>

  <footer>
    Inoffizielle Erweiterung – keine Verbindung zu DFBnet GmbH oder DFB.<br>
    Verwendung auf eigene Verantwortung.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
